name: Run Agent Evals

on:
  workflow_dispatch: # Manual trigger
  push:
    branches:
      - feature/test-ci-cd # Se ejecuta cuando haces push a tu rama
  pull_request:
    types: [opened, synchronize] # When PR is opened or updated
    branches:
      - develop

jobs:
  run-evaluations:
    runs-on: ubuntu-latest
    services:
      firebase:
        image: node:18
        ports:
          - 5001:5001 # Functions
          - 8080:8080 # Firestore
          - 9099:9099 # Auth
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8080 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        command: >
          bash -c "
            npm install -g firebase-tools &&
            firebase emulators:start 
              --project tincho-testing 
              --only firestore,auth,functions
              --host 0.0.0.0
          "

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Wait for emulators to be ready
        run: |
          echo "Waiting for Firebase emulators..."
          echo "Waiting for Firestore emulator..."
          for i in {1..30}; do
            if wget --no-verbose --tries=1 --spider http://localhost:8080 2>/dev/null; then
              echo "Firestore emulator ready!"
              break
            fi
            echo "Attempt $i/30 - waiting..."
            sleep 2
          done

          echo "Waiting for Auth emulator..."
          for i in {1..30}; do
            if wget --no-verbose --tries=1 --spider http://localhost:9099 2>/dev/null; then
              echo "Auth emulator ready!"
              break
            fi
            echo "Attempt $i/30 - waiting..."
            sleep 2
          done

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-production
          path: dist/
          retention-days: 30
