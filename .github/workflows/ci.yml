
name: CI/CD Pipeline
on:
  workflow_dispatch: # Manual trigger
  push:
    branches:
      - feature/test-ci-cd # Se ejecuta cuando haces push a tu rama
  pull_request:
    types: [opened, synchronize] # When PR is opened or updated
    branches:
      - develop

jobs:
  run-evaluations:
    runs-on: ubuntu-latest
    services:
      firebase:
        image: node:18
        ports:
          - 5001:5001 # Functions
          - 8080:8080 # Firestore
          - 9099:9099 # Auth
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8080 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        command: >
          bash -c "
            echo '=== STARTING FIREBASE EMULATORS ===' &&
            echo 'Current directory:' && pwd &&
            echo 'Node version:' && node --version &&
            echo 'NPM version:' && npm --version &&
            echo 'Installing Firebase tools...' &&
            npm install -g firebase-tools &&
            echo 'Firebase tools version:' && firebase --version &&
            echo 'Starting emulators...' &&
            firebase emulators:start 
              --project tincho-testing 
              --only firestore,auth,functions
              --host 0.0.0.0
          "

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Debug Environment
        run: |
          echo "=== DEBUGGING ENVIRONMENT ==="
          echo "OS: $(uname -a)"
          echo "Current directory: $(pwd)"
          echo "Files in current directory:"
          ls -la
          echo "GitHub workspace: $GITHUB_WORKSPACE"
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Debug Node Setup
        run: |
          echo "=== NODE SETUP DEBUG ==="
          echo "Node version after setup: $(node --version)"
          echo "NPM version after setup: $(npm --version)"
          echo "NPM cache location: $(npm config get cache)"

      - name: Install dependencies
        run: |
          echo "=== INSTALLING DEPENDENCIES ==="
          echo "Package.json exists: $(test -f package.json && echo 'YES' || echo 'NO')"
          echo "Package-lock exists: $(test -f package-lock.json && echo 'YES' || echo 'NO')"
          echo "Installing with npm ci..."
          npm ci --legacy-peer-deps
          echo "Dependencies installed successfully!"

      - name: Debug Dependencies
        run: |
          echo "=== DEPENDENCIES DEBUG ==="
          echo "Node modules exist: $(test -d node_modules && echo 'YES' || echo 'NO')"
          echo "Firebase package exists: $(test -d node_modules/firebase && echo 'YES' || echo 'NO')"
          echo "Firebase admin package exists: $(test -d node_modules/firebase-admin && echo 'YES' || echo 'NO')"

      - name: Check Firebase Config
        run: |
          echo "=== FIREBASE CONFIG DEBUG ==="
          echo "Firebase.json exists: $(test -f firebase.json && echo 'YES' || echo 'NO')"
          if [ -f firebase.json ]; then
            echo "Firebase.json content:"
            cat firebase.json
          fi
          echo "Firestore rules exist: $(test -f firestore.rules && echo 'YES' || echo 'NO')"
          echo "Firestore indexes exist: $(test -f firestore.indexes.json && echo 'YES' || echo 'NO')"

      - name: Wait for emulators to be ready
        run: |
          echo "=== WAITING FOR EMULATORS ==="
          echo "Checking if wget is available: $(which wget || echo 'wget not found')"
          echo "Waiting for Firestore emulator..."
          for i in {1..30}; do
            echo "Attempt $i/30 - checking Firestore on port 8080..."
            if wget --no-verbose --tries=1 --spider http://localhost:8080 2>/dev/null; then
              echo "✅ Firestore emulator ready!"
              break
            fi
            echo "❌ Firestore not ready yet, waiting 2 seconds..."
            sleep 2
          done
          
          echo "Waiting for Auth emulator..."
          for i in {1..30}; do
            echo "Attempt $i/30 - checking Auth on port 9099..."
            if wget --no-verbose --tries=1 --spider http://localhost:9099 2>/dev/null; then
              echo "✅ Auth emulator ready!"
              break
            fi
            echo "❌ Auth not ready yet, waiting 2 seconds..."
            sleep 2
          done

      - name: Debug Ports
        run: |
          echo "=== PORT DEBUG ==="
          echo "Checking listening ports:"
          netstat -tlnp || echo "netstat not available"
          echo "Checking with ss:"
          ss -tlnp || echo "ss not available"
          echo "Checking with lsof:"
          lsof -i :8080 || echo "lsof not available"
          lsof -i :9099 || echo "lsof not available"
          lsof -i :5001 || echo "lsof not available"

      - name: Build project
        run: |
          echo "=== BUILDING PROJECT ==="
          echo "Starting build..."
          npm run build
          echo "Build completed!"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-production
          path: dist/
          retention-days: 30
