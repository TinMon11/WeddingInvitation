name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, feature/test-ci-cd]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Setup Google Cloud credentials
        run: |
          echo "🔐 Setting up Google Cloud credentials..."
          echo "${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}" > /tmp/gcp-credentials.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-credentials.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-credentials.json" >> $GITHUB_ENV
          
          echo "📁 Credentials file created at: /tmp/gcp-credentials.json"
          echo "📏 File size: $(wc -c < /tmp/gcp-credentials.json) bytes"
          echo "🔑 First 100 chars of credentials: $(head -c 100 /tmp/gcp-credentials.json)..."
          
          echo "🌐 Setting up gcloud auth..."
          gcloud auth activate-service-account --key-file=/tmp/gcp-credentials.json
          echo "✅ Service account activated"
          
          echo "👤 Current authenticated account:"
          gcloud auth list
          
          echo "🏗️ Current project:"
          gcloud config get-value project

      - name: Install Google Cloud SDK
        run: |
          echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" | sudo tee -a /etc/apt/sources.list.d/google-cloud-sdk.list
          curl https://packages.cloud.google.com/apt/doc/apt-key.gpg | sudo apt-key --keyring /usr/share/keyrings/cloud.google.gpg add -
          sudo apt-get update && sudo apt-get install -y google-cloud-cli

      - name: Download data from bucket
        run: |
          echo "📥 Downloading data from bucket..."
          echo "🔑 Checking authentication before download..."
          gcloud auth list
          echo "🏗️ Current project: $(gcloud config get-value project)"
          
          echo "📦 Testing bucket access..."
          gsutil ls gs://orbit-rearch-cache/
          
          echo "📥 Downloading data from bucket..."
          gsutil -m cp -r gs://orbit-rearch-cache/data-08-27 ./emulator-data
          echo "✅ Data downloaded successfully"
          ls -la ./emulator-data

      - name: Run linter
        run: npm run lint || echo "Lint completed with warnings"

      - name: Run tests with Firebase emulators
        run: |
          echo "🧪 === INICIANDO TESTS CON EMULADORES ==="
          echo "1️⃣ Iniciando emuladores en background con data pre-cargada..."
          firebase emulators:start --project tincho-testing --only firestore,auth --import=./emulator-data &
          EMULATOR_PID=$!

          echo "2️⃣ Esperando que emuladores estén listos..."
          sleep 15

          echo "3️⃣ Verificando que emuladores estén corriendo..."
          curl -s http://localhost:8080 > /dev/null && echo "✅ Firestore emulator running on port 8080"
          curl -s http://localhost:9099 > /dev/null && echo "✅ Auth emulator running on port 9099"

          echo "4️⃣ Ejecutando test de emuladores..."
          FIRESTORE_EMULATOR_HOST=localhost:8080 FIREBASE_AUTH_EMULATOR_HOST=localhost:9099 node src/test/emulator-test.js

          echo "5️⃣ Deteniendo emuladores..."
          kill $EMULATOR_PID
          wait $EMULATOR_PID 2>/dev/null || true

      - name: Build project
        run: npm run build

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            coverage/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
