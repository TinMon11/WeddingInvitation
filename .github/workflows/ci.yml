name: Run Agent Evals

on:
  workflow_dispatch: # Manual trigger
  pull_request:
    types: [opened, synchronize] # When PR is opened or updated
    branches:
      - develop

jobs:
  run-evaluations:
    runs-on: ubuntu-latest
    services:
      firebase:
        image: node:18
        ports:
          - 5001:5001  # Functions
          - 8080:8080  # Firestore
          - 9099:9099  # Auth
          - 4000:4000  # Hosting (si lo usas)
        options: >-
          --health-cmd "curl --fail http://localhost:8080 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        command: >
          bash -c "
            npm install -g firebase-tools &&
            firebase emulators:start 
              --project tincho-testing 
              --only firestore,auth,functions
              --host 0.0.0.0
          "

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Wait for emulators to be ready
        run: |
          echo "Waiting for Firebase emulators..."
          timeout 60 bash -c 'until curl -s http://localhost:8080 > /dev/null; do sleep 2; done'
          echo "Firestore emulator ready!"
          timeout 60 bash -c 'until curl -s http://localhost:9099 > /dev/null; do sleep 2; done'
          echo "Auth emulator ready!"

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-production
          path: dist/
          retention-days: 30
