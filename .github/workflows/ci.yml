name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, feature/test-ci-cd]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Run linter
        run: npm run lint || echo "Lint completed with warnings"

      - name: Run tests with Firebase emulators
        run: |
          echo "🧪 === INICIANDO TESTS CON EMULADORES ==="
          echo "1️⃣ Iniciando emuladores en background..."
          firebase emulators:start --project tincho-testing --only firestore,auth &
          EMULATOR_PID=$!
          
          echo "2️⃣ Esperando que emuladores estén listos..."
          sleep 15
          
          echo "3️⃣ Verificando que emuladores estén corriendo..."
          curl -s http://localhost:8080 > /dev/null && echo "✅ Firestore emulator running on port 8080"
          curl -s http://localhost:9099 > /dev/null && echo "✅ Auth emulator running on port 9099"
          
          echo "4️⃣ Ejecutando test de emuladores..."
          FIRESTORE_EMULATOR_HOST=localhost:8080 FIREBASE_AUTH_EMULATOR_HOST=localhost:9099 node src/test/emulator-test.js
          
          echo "5️⃣ Deteniendo emuladores..."
          kill $EMULATOR_PID
          wait $EMULATOR_PID 2>/dev/null || true

      - name: Build project
        run: npm run build

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            coverage/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  deploy-preview:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-preview
          path: dist/
          retention-days: 1

  deploy-production:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-production
          path: dist/
          retention-days: 30
